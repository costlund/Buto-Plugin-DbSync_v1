settings:
  path: 'row/innerHTML'
content:
  style1:
    type: style
    innerHTML: '.wf_form_row{margin-top:10px;}'
  buttons:
    type: div
    attribute:
      style:
        margin-top: 70px
        display: none
      class: fixed-top text-center map-buttons
    innerHTML:
      -
        type: a
        attribute:
          class: btn btn-primary
          onclick: PluginDbSync_v1.mapBack()
        innerHTML: Back
      -
        type: a
        attribute:
          class: btn btn-primary
          onclick: PluginDbSync_v1.mapDraw()
        innerHTML: Draw all
      -
        type: a
        attribute:
          class: btn btn-primary
          onclick: PluginDbSync_v1.mapClear()
        innerHTML: Clear
      -
        type: a
        attribute:
          class: btn btn-primary
          onclick: PluginWfAjax.update('content')
        innerHTML: Reload
  row:
    type: div
    attribute:
      class: row
      style: "padding:10px"
    
    